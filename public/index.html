<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cộng đồng Học Tiếng Trung - 汉语论坛</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">
  <header class="bg-red-700 text-white py-4 shadow-md sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 flex justify-between items-center">
      <h1 class="text-xl font-bold tracking-wide">🏮 Diễn đàn Học Tiếng Trung (HSK & Giao tiếp)</h1>
      <div id="authStatus" class="text-sm font-medium bg-red-800 px-3 py-1 rounded-full">Chưa đăng nhập</div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 space-y-6">
    <div class="grid md:grid-cols-2 gap-4">
      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
        <h2 class="text-lg font-semibold text-red-700 mb-3">1. Đăng ký tài khoản</h2>
        <form id="registerForm" class="space-y-3">
          <input type="text" id="regUserName" placeholder="Tên hiển thị (vd: Minh Quang)" required class="w-full px-3 py-2 border rounded-lg focus:outline-red-500">
          <input type="email" id="regEmail" placeholder="Email" required class="w-full px-3 py-2 border rounded-lg focus:outline-red-500">
          <input type="password" id="regPassword" placeholder="Mật khẩu" required class="w-full px-3 py-2 border rounded-lg focus:outline-red-500">
          <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-medium py-2 rounded-lg transition">Đăng ký</button>
        </form>
      </div>

      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
        <h2 class="text-lg font-semibold text-red-700 mb-3">2. Đăng nhập</h2>
        <form id="loginForm" class="space-y-3">
          <input type="email" id="loginEmail" placeholder="Email đã đăng ký" required class="w-full px-3 py-2 border rounded-lg focus:outline-red-500">
          <input type="password" id="loginPassword" placeholder="Mật khẩu" required class="w-full px-3 py-2 border rounded-lg focus:outline-red-500">
          <button type="submit" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-medium py-2 rounded-lg transition">Đăng nhập</button>
        </form>
        <div class="mt-3">
          <p class="text-xs text-slate-500 font-semibold uppercase">API KEY HIỆN TẠI:</p>
          <p id="apiKeyDisplay" class="text-xs font-mono bg-slate-100 p-2 rounded break-all text-red-600 mt-1">Chưa có apiKey</p>
        </div>
      </div>
    </div>

    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
      <h2 class="text-lg font-semibold text-red-700 mb-3">3. Chia sẻ góc học tiếng Trung</h2>
      <form id="createPostForm" class="space-y-3">
        <textarea id="postContent" rows="3" placeholder="Chia sẻ kinh nghiệm: Từ vựng HSK, ngữ pháp câu chữ 把, luyện nghe HSK 4..." required class="w-full px-3 py-2 border rounded-lg focus:outline-red-500"></textarea>
        <button type="submit" class="bg-red-600 hover:bg-red-700 text-white font-medium px-5 py-2 rounded-lg transition">Đăng bài</button>
      </form>
    </div>

    <div class="space-y-3">
      <h2 class="text-lg font-semibold text-slate-800">Bài viết trong cộng đồng</h2>
      <div id="postsList" class="space-y-3"></div>
    </div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
